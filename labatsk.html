<!DOCTYPE>
<html>
<head>
<title>LAB TASK</title>
<style>
body
{
background-color:lightgray;
}
h1
{
color:red;
text-align:center;
font-size:25px;
}
table
{
background-color:lightblue;
font-size:15px
}
</style>
</head>
<br><br>
<body>
<h1 ><b>Continental Hotel Reservation Form</b></h1>
<form>
<table border="5" align="center">
<tr>
<th>Name</th>
<td>
<input placeholder="Enter your name" type="text">
</td>
</tr>
<tr>
<th>email</th>
<td>
<input type="email" value="info@continental.pk">
</td>
</tr>
<tr>
<th>Mobile Number:</th>
<td>
<input type="number" placeholder="Enter Your Mobile number ">
</td>
</tr>
<tr>
<th>Arrival time</th>
<td>
<input type="time" placeholder="Enter Your Arrival Time">
</td>
</tr>
<tr>
<th>Departure</th>
<td>
<input type="time" placeholder="Enter your Departure Time">
<input type="date">
</td>
</tr>
<tr>
<th>Room Type</th>
<td>
<input type="radio" name="type">SINGLE
<input type="radio" name="type">DOUBLE<br>
<input type="radio" name="type">PRESIDENTAL SUITE
</td>
</tr>
<tr>
<th>Preferences</th>
<td>
<input type="checkbox" >NON-SMOKING<br>
<input type="checkbox" >INTERNET<br>
<input type="checkbox">FIRM MATTRESS
</td>
</tr>
<tr>
<th>Mode Of Payment</th>
<td>
<input type="checkbox" name="lol" >Cash
<input type="checkbox" name="lol">Check<br>
<input type="checkbox" name="lol">Credit card
<input type="button" value="Select card">
</td>
</tr>
<tr>
<td colspan="2"style="text-align:center;">
<input type="submit" value="Send Data">
</td>
</tr>
</table>
</form>
</body>
</html>
